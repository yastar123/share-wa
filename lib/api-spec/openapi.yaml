openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Email and password authentication
  - name: profile
    description: User profile and preferences
  - name: dashboard
    description: Dashboard summaries and recent activity
  - name: notifications
    description: User notification inbox
  - name: contacts
    description: Consent-aware contact management
  - name: connection
    description: User-owned WhatsApp linked-device connection
  - name: messages
    description: Manual one-recipient messaging
  - name: admin
    description: Admin-only platform overview and user role management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with an email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Credentials did not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a one-time password reset link when the email belongs to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Generic response that does not disclose whether the email is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Change a password using a valid one-time reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmation"
      responses:
        "200":
          description: Password updated and sessions invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Reset token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: signOut
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResult"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile details and language preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /profile/password:
    patch:
      operationId: changePassword
      tags: [profile]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128 }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
              required: [currentPassword, newPassword]
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid current password or new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payout-preferences:
    get:
      operationId: getPayoutPreferences
      tags: [wallet]
      summary: Get the current user's payout destination
      responses:
        "200":
          description: Current payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutPreferences"
    put:
      operationId: savePayoutPreferences
      tags: [wallet]
      summary: Save a bank or e-wallet payout destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutPreferencesInput"
      responses:
        "200":
          description: Saved payout destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutPreferences"
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet balances, withdrawal history, and referral summary
      responses:
        "200":
          description: Wallet and referral information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletOverview"
  /withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Request a withdrawal from available wallet balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, minimum: 1 }
                currency: { type: string, enum: [IDR, USD, CNY] }
              required: [amount, currency]
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "409":
          description: Balance, minimum, or payout destination requirements not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /withdrawals/{withdrawalId}:
    parameters:
      - name: withdrawalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: cancelWithdrawal
      tags: [wallet]
      summary: Cancel a pending withdrawal request
      responses:
        "200":
          description: Withdrawal request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"
        "404":
          description: Withdrawal request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Withdrawal request is already being processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /referrals:
    get:
      operationId: getReferrals
      tags: [wallet]
      summary: Get referral link and referred members
      responses:
        "200":
          description: Referral information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralOverview"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get consent and messaging overview
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent account activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the current user's notifications
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: User notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all current user's notifications as read
      responses:
        "200":
          description: Notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadAllResult"
  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List the current user's contacts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: consent
          in: query
          required: false
          schema:
            type: string
            enum: [all, opted_in, opted_out, pending]
            default: all
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Add a contact with recorded consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /contacts/{contactId}:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact's display details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Remove a contact and its associated message history
      responses:
        "204":
          description: Contact removed
  /contacts/{contactId}/consent:
    parameters:
      - name: contactId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateContactConsent
      tags: [contacts]
      summary: Record consent or opt-out for one contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentUpdate"
      responses:
        "200":
          description: Updated consent record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /connection/status:
    get:
      operationId: getConnectionStatus
      tags: [connection]
      summary: Get the current user's linked-device status
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConnection"
  /connection/pairing-code:
    post:
      operationId: requestPairingCode
      tags: [connection]
      summary: Request a code to link the user's own WhatsApp device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeInput"
      responses:
        "200":
          description: Pairing code requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeResult"
  /connection/qr:
    post:
      operationId: requestWhatsAppQrCode
      tags: [connection]
      summary: Request a temporary QR code to link a WhatsApp account
      responses:
        "200":
          description: Temporary QR code and expiration time
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrCode: { type: string }
                  expiresInSeconds: { type: integer }
                required: [qrCode, expiresInSeconds]
        "409":
          description: WhatsApp account is already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: QR code is not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /connection/disconnect:
    post:
      operationId: disconnectWhatsApp
      tags: [connection]
      summary: Disconnect the current user's linked device
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConnection"
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List recent one-to-one message records
      parameters:
        - name: contactId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendManualMessage
      tags: [messages]
      summary: Send one manual message to one opted-in contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMessageInput"
      responses:
        "201":
          description: Message accepted for sending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Contact has no current consent or device is disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Outbound messaging is paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The account has reached its hourly sending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages/batch:
    post:
      operationId: sendMessageBatch
      tags: [messages]
      summary: Send one message to a small group of opted-in contacts
      description: Sends sequentially with a delay, with a maximum of five recipients per batch and twenty attempted messages per account per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageBatchInput"
      responses:
        "200":
          description: Per-contact results for the batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBatchResult"
        "400":
          description: Invalid batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: A contact does not belong to the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: One or more contacts do not have current consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The account has reached its hourly sending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Outbound messaging is paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Get the current user's admin access status
      responses:
        "200":
          description: Admin access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMe"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get aggregate platform statistics and recent activity
      responses:
        "200":
          description: Aggregate admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List app users and admin roles
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Users and their admin roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Grant or revoke an app admin role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRoleUpdate"
      responses:
        "200":
          description: Updated admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoleUpdateResult"
        "400":
          description: Invalid request or last-admin protection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: At least one admin must remain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      tags: [admin]
      summary: Suspend or reactivate an app account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountStatusUpdate"
      responses:
        "200":
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountStatusResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Account cannot be suspended in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{userId}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Permanently delete an app account and its stored data
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account and its stored data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDeleteResult"
        "202":
          description: Account access blocked; identity provider deletion needs retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDeleteResult"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete the last active admin or the current admin account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/contacts:
    get:
      operationId: listAdminContacts
      tags: [admin]
      summary: List contacts across accounts without exposing full phone numbers
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: consentStatus
          in: query
          required: false
          schema:
            type: string
            enum: [all, opted_in, opted_out, pending]
            default: all
      responses:
        "200":
          description: Paginated contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContactsPage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/contacts/{contactId}:
    patch:
      operationId: updateAdminContact
      tags: [admin]
      summary: Update contact name or consent status
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminContactUpdate"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContact"
        "400":
          description: Invalid request or opt-in evidence missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAdminContact
      tags: [admin]
      summary: Delete a contact and its stored message history
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Contact and related message history deleted
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/messages:
    get:
      operationId: listAdminMessages
      tags: [admin]
      summary: Review stored message history across accounts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: ownerUserId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, queued, sent, delivered, failed]
            default: all
      responses:
        "200":
          description: Paginated stored messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessagesPage"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendAdminMessage
      tags: [admin]
      summary: Send one message as an account to its opted-in contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageSend"
      responses:
        "201":
          description: Message sent and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageSendResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account or contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Contact is not opted in or account is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The account has reached its hourly sending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Outbound messaging is paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/messages/{messageId}:
    delete:
      operationId: deleteAdminMessage
      tags: [admin]
      summary: Delete a stored message record without recalling the delivered message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Stored message record deleted
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/system:
    get:
      operationId: getAdminSystemSettings
      tags: [admin]
      summary: Get global outbound messaging settings
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemSettings"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAdminSystemSettings
      tags: [admin]
      summary: Pause or resume all outbound WhatsApp messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSystemSettingsUpdate"
      responses:
        "200":
          description: System settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystemSettings"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/withdrawals:
    get:
      operationId: listAdminWithdrawals
      tags: [admin]
      summary: Review withdrawal requests
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, pending, paid, rejected, cancelled]
            default: pending
      responses:
        "200":
          description: Withdrawal requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminWithdrawal"
    patch:
      operationId: updateAdminWithdrawal
      tags: [admin]
      summary: Approve or reject a withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                withdrawalId: { type: string, format: uuid }
                status: { type: string, enum: [paid, rejected] }
                adminNote: { type: string, maxLength: 500 }
              required: [withdrawalId, status]
      responses:
        "200":
          description: Withdrawal request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminWithdrawal"
        "404":
          description: Withdrawal request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/connections/{userId}/disconnect:
    post:
      operationId: disconnectAdminUserWhatsApp
      tags: [admin]
      summary: Disconnect a user's WhatsApp session without returning credentials
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WhatsApp session disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConnectionActionResult"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AuthCredentials:
      type: object
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
      required: [identifier, password]
    PasswordResetRequest:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 254 }
      required: [email]
    PasswordResetConfirmation:
      type: object
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 128 }
      required: [token, password]
    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]
    NotificationReadAllResult:
      type: object
      properties:
        updated: { type: boolean }
      required: [updated]
    UserRegistration:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        username: { type: string, minLength: 3, maxLength: 28, pattern: "^[a-z0-9_]+$" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        referralCode: { type: string, maxLength: 16 }
        termsAccepted: { type: boolean }
        captchaToken: { type: string, maxLength: 4096 }
      required: [fullName, username, email, password, termsAccepted]
    AuthUser:
      type: object
      properties:
        userId: { type: string }
        email: { type: ["string", "null"], format: email }
        fullName: { type: string }
        isAdmin: { type: boolean }
      required: [userId, email, fullName, isAdmin]
    SignOutResult:
      type: object
      properties:
        signedOut: { type: boolean }
      required: [signedOut]
    UserProfile:
      type: object
      properties:
        fullName: { type: string }
        username: { type: string }
        telegramUsername: { type: ["string", "null"] }
        language: { type: string, enum: [id, en, zh] }
        preferredCurrency: { type: string, enum: [IDR, USD, CNY] }
        referralCode: { type: string }
      required: [fullName, username, language, preferredCurrency, referralCode]
    UserProfileUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        telegramUsername: { type: ["string", "null"], maxLength: 64 }
        language: { type: string, enum: [id, en, zh] }
        preferredCurrency: { type: string, enum: [IDR, USD, CNY] }
    CurrencySetting:
      type: object
      properties:
        enabled: { type: boolean }
        minimumWithdrawal: { type: integer, minimum: 1 }
        earningPerMessage: { type: integer, minimum: 0 }
        commissionPerMessage: { type: integer, minimum: 0 }
      required: [enabled, minimumWithdrawal, earningPerMessage, commissionPerMessage]
    PayoutPreferences:
      type: object
      properties:
        method: { type: ["string", "null"], enum: [bank, e_wallet, null] }
        institution: { type: ["string", "null"] }
        accountNumber: { type: ["string", "null"] }
        accountHolder: { type: ["string", "null"] }
      required: [method, institution, accountNumber, accountHolder]
    PayoutPreferencesInput:
      type: object
      properties:
        method: { type: string, enum: [bank, e_wallet] }
        institution: { type: string, minLength: 2, maxLength: 80 }
        accountNumber: { type: string, minLength: 4, maxLength: 40 }
        accountHolder: { type: string, minLength: 2, maxLength: 120 }
      required: [method, institution, accountNumber, accountHolder]
    Withdrawal:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        currency: { type: string, enum: [IDR, USD, CNY] }
        status: { type: string, enum: [pending, paid, rejected, cancelled] }
        payoutMethod: { type: string }
        payoutInstitution: { type: string }
        payoutAccountNumber: { type: string }
        payoutAccountHolder: { type: string }
        adminNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, amount, currency, status, payoutMethod, payoutInstitution, payoutAccountNumber, payoutAccountHolder, createdAt]
    AdminWithdrawal:
      allOf:
        - $ref: "#/components/schemas/Withdrawal"
        - type: object
          properties:
            ownerUsername: { type: string }
          required: [ownerUsername]
    WalletOverview:
      type: object
      properties:
        currency: { type: string, enum: [IDR, USD, CNY] }
        availableBalance: { type: integer }
        totalEarned: { type: integer }
        totalWithdrawn: { type: integer }
        minimumWithdrawal: { type: integer }
        earningPerMessage: { type: integer }
        commissionPerMessage: { type: integer }
        withdrawals:
         type: array
         items: { $ref: "#/components/schemas/Withdrawal" }
        referralCode: { type: string }
        referralCount: { type: integer }
        referralMessages: { type: integer }
        referralEarnings: { type: integer }
        payoutConfigured: { type: boolean }
      required: [currency, availableBalance, totalEarned, totalWithdrawn, minimumWithdrawal, earningPerMessage, commissionPerMessage, withdrawals, referralCode, referralCount, referralMessages, referralEarnings, payoutConfigured]
    ReferralOverview:
      type: object
      properties:
        referralCode: { type: string }
        referralLink: { type: string }
        members:
         type: array
         items:
           type: object
           properties:
             username: { type: string }
             joinedAt: { type: string, format: date-time }
             sentMessages: { type: integer }
           required: [username, joinedAt, sentMessages]
      required: [referralCode, referralLink, members]
    DashboardSummary:
      type: object
      properties:
        connectionStatus:
          type: string
          enum: [disconnected, awaiting_link, connected, reconnecting, error]
        linkedPhone: { type: ["string", "null"] }
        totalContacts: { type: integer }
        optedInContacts: { type: integer }
        optedOutContacts: { type: integer }
        messagesQueued: { type: integer }
        messagesSent: { type: integer }
        messagesDelivered: { type: integer }
        messagesFailed: { type: integer }
        messagesDeliveredLast7Days: { type: integer }
        messagesFailedLast7Days: { type: integer }
      required:
        - connectionStatus
        - totalContacts
        - optedInContacts
        - optedOutContacts
        - messagesQueued
        - messagesSent
        - messagesDelivered
        - messagesFailed
        - messagesDeliveredLast7Days
        - messagesFailedLast7Days
    ActivityItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: Activity event identifier stored by the workspace. }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, kind, summary, createdAt]
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, kind, title, body, readAt, createdAt]
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        phone: { type: string }
        consentStatus: { type: string, enum: [opted_in, opted_out, pending] }
        consentSource: { type: ["string", "null"] }
        consentedAt: { type: ["string", "null"], format: date-time }
        optedOutAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, displayName, phone, consentStatus, createdAt]
    ContactInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, minLength: 7, maxLength: 20 }
        consentConfirmed: { type: boolean }
        consentSource: { type: string, minLength: 2, maxLength: 200 }
      required: [displayName, phone, consentConfirmed, consentSource]
    ContactUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
      required: [displayName]
    ConsentUpdate:
      type: object
      properties:
        status: { type: string, enum: [opted_in, opted_out] }
        source: { type: string, maxLength: 200 }
      required: [status]
    WhatsAppConnection:
      type: object
      properties:
        status: { type: string, enum: [disconnected, awaiting_link, connected, reconnecting, error] }
        linkedPhone: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }
      required: [status]
    PairingCodeInput:
      type: object
      properties:
        phone: { type: string, minLength: 7, maxLength: 20 }
      required: [phone]
    PairingCodeResult:
      type: object
      properties:
        status: { type: string, enum: [awaiting_link] }
        pairingCode: { type: string }
        expiresInSeconds: { type: integer }
      required: [status, pairingCode, expiresInSeconds]
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        contactId: { type: string, format: uuid }
        contactName: { type: string }
        phone: { type: string }
        text: { type: string }
        status: { type: string, enum: [queued, sent, delivered, failed] }
        createdAt: { type: string, format: date-time }
      required: [id, contactId, contactName, phone, text, status, createdAt]
    ManualMessageInput:
      type: object
      properties:
        contactId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000 }
      required: [contactId, text]
    MessageBatchInput:
      type: object
      properties:
        contactIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000 }
      required: [contactIds, text]
    MessageBatchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              contactId: { type: string, format: uuid }
              contactName: { type: string }
              status: { type: string, enum: [sent, failed, skipped] }
              error: { type: string }
            required: [contactId, contactName, status]
      required: [results]
    AdminMe:
      type: object
      properties:
        isAdmin: { type: boolean }
      required: [isAdmin]
    AdminConnectionCounts:
      type: object
      properties:
        connected: { type: integer }
        disconnected: { type: integer }
        awaitingLink: { type: integer }
        reconnecting: { type: integer }
        error: { type: integer }
      required: [connected, disconnected, awaitingLink, reconnecting, error]
    AdminActivityItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        username: { type: string }
        kind: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, userId, username, kind, createdAt]
    AdminOverview:
      type: object
      properties:
        totalUsers: { type: integer }
        totalAdmins: { type: integer }
        suspendedUsers: { type: integer }
        deletionPendingUsers: { type: integer }
        totalContacts: { type: integer }
        optedInContacts: { type: integer }
        optedOutContacts: { type: integer }
        pendingContacts: { type: integer }
        totalMessages: { type: integer }
        sentMessages: { type: integer }
        deliveredMessages: { type: integer }
        failedMessages: { type: integer }
        connections:
          $ref: "#/components/schemas/AdminConnectionCounts"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AdminActivityItem"
      required:
        - totalUsers
        - totalAdmins
        - suspendedUsers
        - deletionPendingUsers
        - totalContacts
        - optedInContacts
        - optedOutContacts
        - pendingContacts
        - totalMessages
        - sentMessages
        - deliveredMessages
        - failedMessages
        - connections
        - recentActivity
    AdminUser:
      type: object
      properties:
        userId: { type: string }
        email: { type: ["string", "null"] }
        fullName: { type: string }
        username: { type: string }
        language: { type: string, enum: [id, en, zh] }
        isAdmin: { type: boolean }
        accountStatus: { type: string, enum: [active, suspended, deletion_pending] }
        connectionStatus:
          type: string
          enum: [disconnected, awaiting_link, connected, reconnecting, error]
        createdAt: { type: string, format: date-time }
      required: [userId, email, fullName, username, language, isAdmin, accountStatus, connectionStatus, createdAt]
    AdminUsersPage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [users, total, limit, offset]
    AdminRoleUpdate:
      type: object
      properties:
        isAdmin: { type: boolean }
      required: [isAdmin]
    AdminRoleUpdateResult:
      type: object
      properties:
        userId: { type: string }
        isAdmin: { type: boolean }
      required: [userId, isAdmin]
    AdminAccountStatusUpdate:
      type: object
      properties:
        status: { type: string, enum: [active, suspended] }
      required: [status]
    AdminAccountStatusResult:
      type: object
      properties:
        userId: { type: string }
        status: { type: string, enum: [active, suspended] }
      required: [userId, status]
    AdminUserDeleteResult:
      type: object
      properties:
        userId: { type: string }
        status: { type: string, enum: [deleted, deletion_pending] }
      required: [userId, status]
    AdminContact:
      type: object
      properties:
        contactId: { type: string, format: uuid }
        ownerUserId: { type: string }
        ownerUsername: { type: string }
        displayName: { type: string }
        phoneMasked: { type: string }
        consentStatus: { type: string, enum: [opted_in, opted_out, pending] }
        consentSource: { type: ["string", "null"] }
        consentedAt: { type: ["string", "null"], format: date-time }
        optedOutAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [contactId, ownerUserId, ownerUsername, displayName, phoneMasked, consentStatus, consentSource, consentedAt, optedOutAt, createdAt]
    AdminContactsPage:
      type: object
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/AdminContact" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [contacts, total, limit, offset]
    AdminContactUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        consentStatus: { type: string, enum: [opted_in, opted_out, pending] }
        consentSource: { type: string, minLength: 2, maxLength: 200 }
    AdminMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerUserId: { type: string }
        ownerUsername: { type: string }
        contactId: { type: string, format: uuid }
        contactName: { type: string }
        phoneMasked: { type: string }
        text: { type: string }
        status: { type: string, enum: [queued, sent, delivered, failed] }
        createdAt: { type: string, format: date-time }
      required: [id, ownerUserId, ownerUsername, contactId, contactName, phoneMasked, text, status, createdAt]
    AdminMessagesPage:
      type: object
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/AdminMessage" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [messages, total, limit, offset]
    AdminMessageSend:
      type: object
      properties:
        ownerUserId: { type: string }
        contactId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000 }
      required: [ownerUserId, contactId, text]
    AdminMessageSendResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerUserId: { type: string }
        contactId: { type: string, format: uuid }
        status: { type: string, enum: [sent, failed] }
        createdAt: { type: string, format: date-time }
      required: [id, ownerUserId, contactId, status, createdAt]
    AdminSystemSettings:
      type: object
      properties:
        outboundMessagingEnabled: { type: boolean }
        currencySettings:
          type: object
          properties:
            IDR: { $ref: "#/components/schemas/CurrencySetting" }
            USD: { $ref: "#/components/schemas/CurrencySetting" }
            CNY: { $ref: "#/components/schemas/CurrencySetting" }
          required: [IDR, USD, CNY]
        updatedAt: { type: ["string", "null"], format: date-time }
      required: [outboundMessagingEnabled, currencySettings, updatedAt]
    AdminSystemSettingsUpdate:
      type: object
      properties:
        outboundMessagingEnabled: { type: boolean }
        currencySettings:
          type: object
          properties:
            IDR: { $ref: "#/components/schemas/CurrencySetting" }
            USD: { $ref: "#/components/schemas/CurrencySetting" }
            CNY: { $ref: "#/components/schemas/CurrencySetting" }
          required: [IDR, USD, CNY]
      required: [outboundMessagingEnabled]
    AdminConnectionActionResult:
      type: object
      properties:
        userId: { type: string }
        status: { type: string, enum: [disconnected] }
      required: [userId, status]
